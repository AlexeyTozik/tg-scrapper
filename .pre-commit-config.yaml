repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        types: [python]
        language: system

      - id: ruff-lint
        name: ruff lint (fix + check)
        entry: uv run ruff check --fix
        types: [python]
        language: system

      - id: mypy
        name: mypy
        entry: uv run mypy
        types: [python]
        language: system
        pass_filenames: false
