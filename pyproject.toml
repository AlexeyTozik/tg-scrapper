[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-scrapper"
version = "0.1.0"
description = "Telegram export, embeddings, indexing, and RAG query CLI."
readme = "README.md"
license = "LicenseRef-Proprietary"
authors = [
    { name = "Alexey Tozik" },
]
requires-python = ">=3.13,<3.14"
keywords = ["telegram", "rag", "embeddings", "chromadb", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "telethon==1.43.1",
    "sentence-transformers>=5.0.0",
    "python-dotenv>=1.1.1",
    "openai>=2.7.1",
    "torch",
    "torchvision",
    "torchaudio",
    "chromadb>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/AlexeyTozik/tg-scrapper"
Repository = "https://github.com/AlexeyTozik/tg-scrapper"
Issues = "https://github.com/AlexeyTozik/tg-scrapper/issues"

[project.scripts]
tg-scrapper = "tg_scrapper.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tg_scrapper = ["prompts/*.txt"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["."]
exclude = ["^build/", "^dist/", "^src/tg_scrapper\\.egg-info/"]

[dependency-groups]
dev = [
    "build>=1.3.0",
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "ruff>=0.15.11",
]
